name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -v -coverprofile=profile.cov ./...

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: profile.cov

  test-icmp:
    name: Raw ICMP integration (Linux, root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The unit tests substitute every raw socket; this sends real ICMP echo
      # requests to the loopback addresses. The binary is built as the runner
      # user and only executed as root, so sudo needs no Go toolchain.
      - name: Build integration test binary
        run: go test -c -tags integration -o pinger-integration.test ./internal/pinger

      - name: Run as root
        run: sudo ./pinger-integration.test -test.run Integration -test.v

  test-web:
    name: Web logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test internal/web/jstest/*.test.mjs

  test-macos:
    name: Run Tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Releases ship a Windows binary that no job runs; vetting the Windows
      # build at least keeps it compiling.
      - name: Vet (Windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ steps.setup-go.outputs.go-version }}
          # Go is already set up (with module cache) above; a second cache
          # restore into ~/go/pkg/mod makes tar fail with "File exists".
          cache: false
          repo-checkout: false
